name: Property and conformance campaigns

# Long searches on the latest Roc nightly: ten minutes per fuzz target, every
# conformance review including the robustness campaigns, and RocSyntax and
# AsciiDoc explorations with a new recorded seed. Pull requests run smoke-sized
# versions of all of these in ci.yml (`blueprint run check`). The fuzz corpus
# grows in the Actions cache, keyed by target, nightly and fuzz sources.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Resolve the Roc nightly
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every target registered in scripts/run_fuzz.py.
        target:
          - asciidoc-raw
          - asciidoc-structured
          - markdown-document
          - markdown-blocks
          - markdown-refdefs
          - markdown-inline
          - markdown-inline-ast
          - markdown-inline-pathological
          - yaml
          - yaml-raw
          - yaml-source
          - yaml-roundtrip
          - yaml-block
          - xml
          - xml-raw
          - xml-roundtrip
          - xml-malformed
          - json-raw
          - json-options
          - json-roundtrip
          - csv
          - csv-raw
          - csv-roundtrip
          - csv-decode
          - http-request
          - http-response
          - http-raw
          - http-roundtrip
          - http-smuggling
          - parser-combinators
          - string-primitives
          - byte-scan
          - roc-syntax-raw
          - roc-syntax-structured
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8a6c914fa8400c9d1f5a3815ab06e06687d58148
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - name: Restore and save the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .roc-parser-tmp/fuzz/corpus/${{ matrix.target }}
          key: fuzz-${{ runner.os }}-${{ matrix.target }}-${{ needs.nightly.outputs.tag }}-${{ hashFiles('fuzz/**') }}-${{ github.run_id }}
          restore-keys: fuzz-${{ runner.os }}-${{ matrix.target }}-${{ needs.nightly.outputs.tag }}-
      - name: Run a ten-minute campaign
        env:
          TARGET: ${{ matrix.target }}
        run: blueprint run fuzz -- campaign "$TARGET" --seconds 600
      - name: Upload the reproducer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            .roc-parser-tmp/fuzz/bin/${{ matrix.target }}
            .roc-parser-tmp/fuzz/corpus/${{ matrix.target }}/
            .roc-parser-tmp/fuzz/runs/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14

  conformance:
    name: Conformance ${{ matrix.review }}
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every review registered in scripts/check_conformance.py.
        review:
          - yaml
          - yaml-robustness
          - markdown-inline
          - markdown-blocks
          - xml
          - json
          - json-robustness
          - csv
          - http
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8a6c914fa8400c9d1f5a3815ab06e06687d58148
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - env:
          REVIEW: ${{ matrix.review }}
        run: blueprint run conformance -- "$REVIEW"
      - name: Upload review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-evidence-${{ matrix.review }}
          path: |
            .roc-parser-tmp/
            !.roc-parser-tmp/oracle-venv/
          if-no-files-found: warn
          retention-days: 14

  roc-syntax:
    name: RocSyntax exploration
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8a6c914fa8400c9d1f5a3815ab06e06687d58148
        with:
          cache: 'true'
          cache-workload: oracles
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - name: Restore the raw syntax corpus for oracle mutations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .roc-parser-tmp/fuzz/corpus/roc-syntax-raw
          key: fuzz-${{ runner.os }}-roc-syntax-raw-${{ needs.nightly.outputs.tag }}-${{ hashFiles('fuzz/**') }}-${{ github.run_id }}
          restore-keys: fuzz-${{ runner.os }}-roc-syntax-raw-${{ needs.nightly.outputs.tag }}-
      - name: Explore with a new recorded seed
        run: blueprint run roc-syntax -- --seed "$GITHUB_RUN_ID" --generated 10000 --mutation-runs 10000 --reference-performance smoke
      - name: Upload syntax validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roc-syntax-validation
          path: |
            .roc-parser-tmp/roc-syntax-validation/
            !.roc-parser-tmp/roc-syntax-validation/oracle/
            !.roc-parser-tmp/roc-syntax-validation/performance-oracle/
          if-no-files-found: warn
          retention-days: 14

  asciidoc:
    name: AsciiDoc exploration
    needs: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@8a6c914fa8400c9d1f5a3815ab06e06687d58148
        with:
          cache: 'true'
          cache-workload: oracles
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ needs.nightly.outputs.tag }}
      - name: Explore with a new recorded seed
        run: blueprint run asciidoc -- --generated 2000 --mutations 2000 --seed "$GITHUB_RUN_ID"
      - name: Upload oracle evidence and reproducers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asciidoc-validation
          path: |
            .roc-parser-tmp/asciidoc/
            !.roc-parser-tmp/asciidoc/gems/
          if-no-files-found: warn
          retention-days: 14
