name: XML compiler controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        case: [single, no-fill, boxed]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          nightly-tag: nightly-2026-11-15-f25da45
      - name: Prepare the selected control
        env:
          CONTROL: ${{ matrix.case }}
        run: |
          python3 - <<'SCRIPT'
          from pathlib import Path
          import os
          case = os.environ['CONTROL']
          p = Path('package/XmlCore.roc')
          s = p.read_text()
          if case == 'single':
              s = s.replace('if (props.namespaces) Single(chunk_initial(props)) else Batch(chunk_batch_initial(props))', 'Single(chunk_initial(props))')
          elif case == 'no-fill':
              s = s.replace('filled = chunk_fill(decoded, bytes, $empty)', 'filled = { state: decoded, consumed: 0.U64, events: $empty }')
          elif case == 'boxed':
              s = s.replace('Batch(chunk_batch_initial(props))', 'Batch(Box.box(chunk_batch_initial(props)))')
              s = s.replace('Batch(ChunkBatch)', 'Batch(Box(ChunkBatch))')
              s = s.replace('Batch(batch) => { location: Text(batch.event_at), declaration: Box.unbox(Box.unbox(batch.decoder).declaration) }', 'Batch(boxed) => { batch = Box.unbox(boxed); { location: Text(batch.event_at), declaration: Box.unbox(Box.unbox(batch.decoder).declaration) } }')
              s = s.replace('Batch(batch) => {\n\t\tnext = chunk_batch_step(batch, bytes, end)\n\t\t{ state: Batch(next.state), consumed: next.consumed, outcome: next.outcome }', 'Batch(boxed) => {\n\t\tnext = chunk_batch_step(Box.unbox(boxed), bytes, end)\n\t\t{ state: Batch(Box.box(next.state)), consumed: next.consumed, outcome: next.outcome }')
          p.write_text(s)
          SCRIPT
      - name: Build the control
        env:
          CONTROL: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p .roc-parser-tmp/xml-controls
          roc version
          cat fuzz/XmlProperties.roc
          roc build --fuzz fuzz/XmlProperties.roc --output=.roc-parser-tmp/xml-controls/xml 2>&1 | tee .roc-parser-tmp/xml-controls/build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: xml-control-${{ matrix.case }}
          path: |
            .roc-parser-tmp/xml-controls/build.log
            package/XmlCore.roc
