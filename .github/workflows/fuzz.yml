name: XML compiler controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        case: [bulk-clear, fresh-clear]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          nightly-tag: nightly-2026-11-15-f25da45
      - name: Prepare the selected control
        env:
          CONTROL: ${{ matrix.case }}
        run: |
          python3 - <<'SCRIPT'
          from pathlib import Path
          import os
          case = os.environ['CONTROL']
          p = Path('package/XmlCore.roc')
          s = p.read_text()
          before = 'var $empty = batch.events\n\twhile !$empty.is_empty() {\n\t\t$empty = $empty.drop_last(1)\n\t}'
          replacement = 'empty = batch.events.drop_last(batch.events.len())' if case == 'bulk-clear' else 'empty = []'
          assert before in s
          s = s.replace(before, replacement).replace('chunk_fill(decoded, bytes, $empty)', 'chunk_fill(decoded, bytes, empty)')
          p.write_text(s)
          SCRIPT
      - name: Build the control
        env:
          CONTROL: ${{ matrix.case }}
        run: |
          set -euo pipefail
          mkdir -p .roc-parser-tmp/xml-controls
          roc version
          cat fuzz/XmlProperties.roc
          roc build --fuzz fuzz/XmlProperties.roc --output=.roc-parser-tmp/xml-controls/xml 2>&1 | tee .roc-parser-tmp/xml-controls/build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: xml-control-${{ matrix.case }}
          path: |
            .roc-parser-tmp/xml-controls/build.log
            package/XmlCore.roc
