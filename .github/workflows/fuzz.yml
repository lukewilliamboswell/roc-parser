name: XML compiler controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        case: [parallel, warm, isolated, absolute]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          nightly-tag: nightly-2026-11-15-f25da45
      - name: Prepare the selected control
        env:
          CONTROL: ${{ matrix.case }}
        run: |
          python3 - <<'SCRIPT'
          from pathlib import Path
          import os
          p = Path('fuzz/XmlProperties.roc')
          case = os.environ['CONTROL']
          lines = p.read_text().splitlines(keepends=True)
          if case in ('xml', 'namespace'):
              def keep(line):
                  if '.target,' in line or (line.startswith('import Xml') and 'Property' in line):
                      return ('Xmlns' in line) == (case == 'namespace')
                  return True
              p.write_text(''.join(line for line in lines if keep(line)))
          SCRIPT
      - name: Build the control
        env:
          CONTROL: ${{ matrix.case }}
        run: |
          mkdir -p .roc-parser-tmp/xml-controls
          roc version
          cat fuzz/XmlProperties.roc
          if [[ "$CONTROL" == warm || "$CONTROL" == isolated ]]; then roc test --opt=dev package/main.roc; fi
          if [[ "$CONTROL" == parallel ]]; then
            python3 scripts/run_fuzz.py build Text Xml --jobs 2 2>&1 | tee .roc-parser-tmp/xml-controls/build.log
          elif [[ "$CONTROL" == isolated ]]; then
            ROC_CACHE_DIR="$PWD/.roc-parser-tmp/xml-controls/compiler-cache" roc build --fuzz fuzz/XmlProperties.roc --output=.roc-parser-tmp/xml-controls/xml 2>&1 | tee .roc-parser-tmp/xml-controls/build.log
          elif [[ "$CONTROL" == absolute ]]; then
            roc build --fuzz "$PWD/fuzz/XmlProperties.roc" --output=.roc-parser-tmp/xml-controls/xml 2>&1 | tee .roc-parser-tmp/xml-controls/build.log
          else
            roc build --fuzz fuzz/XmlProperties.roc --output=.roc-parser-tmp/xml-controls/xml 2>&1 | tee .roc-parser-tmp/xml-controls/build.log
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: xml-control-${{ matrix.case }}
          path: |
            .roc-parser-tmp/xml-controls/build.log
            fuzz/XmlProperties.roc
