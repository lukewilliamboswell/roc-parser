name: Property quality tests

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || inputs.nightly_validation) }}

jobs:
  fuzz:
    name: Quality ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - markdown-document
          - markdown-inline
          - yaml
          - xml
          - csv
          - http-request
          - http-response
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Restore scheduled corpus
        if: (github.event_name != 'pull_request' && !inputs.nightly_validation)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .roc-parser-tmp/fuzz/corpus/${{ matrix.target }}
          key: fuzz-${{ runner.os }}-${{ matrix.target }}-${{ steps.roc-version.outputs.nightly-tag }}-${{ hashFiles('fuzz/**') }}-${{ github.run_id }}
          restore-keys: fuzz-${{ runner.os }}-${{ matrix.target }}-${{ steps.roc-version.outputs.nightly-tag }}-

      - name: Run pull-request smoke campaign
        if: (github.event_name == 'pull_request' || inputs.nightly_validation)
        run: python3 scripts/run_fuzz.py smoke "${{ matrix.target }}"

      - name: Run scheduled campaign
        if: (github.event_name != 'pull_request' && !inputs.nightly_validation)
        run: python3 scripts/run_fuzz.py campaign "${{ matrix.target }}" --seconds 600

      - name: Upload failure reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: |
            .roc-parser-tmp/fuzz/bin/${{ matrix.target }}
            .roc-parser-tmp/fuzz/corpus/${{ matrix.target }}/
            .roc-parser-tmp/fuzz/runs/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14

  yaml-conformance:
    name: YAML 1.2 conformance and robustness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install review compiler
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: nightly-2026-09-29-7f11a82
      - name: Create oracle environment
        run: python3 -m venv /tmp/roc-parser-yaml-oracle
      - name: Install pinned pure Python oracle
        run: /tmp/roc-parser-yaml-oracle/bin/python -m pip install --no-deps -r scripts/yaml/requirements.txt
      - name: Test review harness
        run: /tmp/roc-parser-yaml-oracle/bin/python -m unittest discover -s scripts/tests -p test_review_yaml.py
      - name: Check explicit conformance baseline
        run: /tmp/roc-parser-yaml-oracle/bin/python scripts/review_yaml.py check --baseline scripts/yaml/known-failures.json
      - name: Run YAML robustness smoke
        if: ${{ !cancelled() }}
        run: /tmp/roc-parser-yaml-oracle/bin/python scripts/review_yaml.py campaign --smoke
      - name: Upload YAML review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaml-conformance-evidence
          path: .roc-parser-tmp/yaml-review/
          if-no-files-found: warn
          retention-days: 14

  property-quality:
    name: property-quality
    if: always()
    needs: [fuzz, yaml-conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful fuzzing
        run: python3 scripts/workflow_helpers.py require-success "${{ needs.fuzz.result }}"
      - name: Require YAML conformance checks
        run: python3 scripts/workflow_helpers.py require-success "${{ needs.yaml-conformance.result }}"
