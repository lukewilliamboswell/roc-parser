name: Nightly compatibility

# Does the latest final release, and its examples archive, still work with
# the latest Roc nightly? roc-automation's shared workflow selects the pair,
# runs the archive's spec.json unchanged and keeps one tracking issue.
# See docs/maintaining.adoc.
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      nightly-tag:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''
permissions: {}
jobs:
  compatibility:
    permissions:
      contents: read
      issues: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/nightly-compatibility.yml@93ca242217b1b7590554b9a12b9ac3bbfbf8bcbe
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      release-tag: ${{ inputs.release-tag || '' }}
      runners: '["ubuntu-24.04"]'
      report-issue: true
