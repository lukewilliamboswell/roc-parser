name: docs

# Builds the roc-parser manual (docs/*.adoc) as a website and a PDF and uploads
# both for review, and checks every Roc example the manual includes. The Pages
# site itself is published by the release workflow, which shows the released
# version's manual and API reference; publishing from main here would replace
# that site with documentation for unreleased APIs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # The examples use basic-cli 0.23.0, which needs a newer compiler than
  # .roc-version. Return to .roc-version once it reaches this.
  QUALITY_ROC_NIGHTLY: nightly-2026-09-29-7f11a82

jobs:
  manual:
    name: Build the manual
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This build tracks the branch, not a release, and says so on its title
      # page rather than claiming the last published version.
      #
      # The build fails on what a reader would see going wrong: Asciidoctor
      # warnings, typographic replacements in inline code (HTML and PDF text),
      # unresolved cross references, unhighlighted code, third-party requests,
      # and, rendered in headless Chromium, Rouge tokens with their own
      # background, text below WCAG AA contrast in either scheme, and sideways
      # page scroll or buried content at phone and tablet widths
      # (scripts/check_manual_render.cjs).
      - name: Build and check HTML and PDF
        env:
          DOCS_VERSION: ${{ github.event_name == 'pull_request' && format('pull request {0}', github.event.number) || github.ref_name }}
        run: python3 scripts/build_manual.py --pdf --docs-version "$DOCS_VERSION"

      - name: Upload the manual
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roc-parser-manual
          path: .docs-out/site
          retention-days: 14

  examples:
    name: Check the manual's examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.QUALITY_ROC_NIGHTLY }}

      # fmt --check, check, test and run every docs/examples/*.roc, comparing
      # output with <name>.expected where one exists.
      - name: Check documentation examples
        run: python3 scripts/check_doc_examples.py

      # The API audit: every exposed module and entry has a doc comment, and
      # no doc prose renders as something other than what was meant.
      - name: Check the API reference
        run: python3 scripts/build_docs.py --check
