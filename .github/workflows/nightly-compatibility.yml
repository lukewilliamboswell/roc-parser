name: Nightly compiler compatibility

on:
  pull_request:
    paths:
      - 'package/**'
      - 'examples/**'
      - 'scripts/check_nightly_compat.py'
      - '.github/workflows/nightly-compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'package/**'
      - 'examples/**'
      - 'scripts/check_nightly_compat.py'
      - '.github/workflows/nightly-compatibility.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-compatibility-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    name: Resolve latest compiler source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nightly: ${{ steps.compiler.outputs.nightly }}
      revision: ${{ steps.compiler.outputs.revision }}
      zig: ${{ steps.compiler.outputs.zig }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_nightly_compat.py resolve

  official-macos:
    name: Official nightly (macOS arm64)
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          version: nightly
          nightly-tag: ${{ needs.resolve.outputs.nightly }}
          download-method: asset-api
      - run: python3 scripts/check_nightly_compat.py check --build-mode Official --expect-machine arm64 --nightly '${{ needs.resolve.outputs.nightly }}' --revision '${{ needs.resolve.outputs.revision }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-official-macos-arm64
          path: .roc-parser-tmp/nightly-compatibility/
          if-no-files-found: ignore

  safe-macos:
    name: ReleaseSafe checker (macOS arm64)
    needs: resolve
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: roc-lang/roc
          ref: ${{ needs.resolve.outputs.revision }}
          path: .roc-parser-tmp/nightly-source
          persist-credentials: false
      - run: python3 scripts/check_nightly_compat.py zig --version '${{ needs.resolve.outputs.zig }}'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: checker
        with:
          path: .roc-parser-tmp/nightly-source/zig-out/bin/roc
          key: checker-${{ runner.os }}-${{ runner.arch }}-${{ needs.resolve.outputs.revision }}-${{ needs.resolve.outputs.zig }}-ReleaseSafe-v1
      - if: steps.checker.outputs.cache-hit != 'true'
        working-directory: .roc-parser-tmp/nightly-source
        run: zig build roc -Doptimize=ReleaseSafe -j2
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.checker.outputs.cache-hit != 'true'
        with:
          path: .roc-parser-tmp/nightly-source/zig-out/bin/roc
          key: ${{ steps.checker.outputs.cache-primary-key }}
      - run: python3 scripts/check_nightly_compat.py check --roc .roc-parser-tmp/nightly-source/zig-out/bin/roc --source .roc-parser-tmp/nightly-source --build-mode ReleaseSafe --expect-machine arm64 --nightly '${{ needs.resolve.outputs.nightly }}' --revision '${{ needs.resolve.outputs.revision }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-safe-macos-arm64
          path: .roc-parser-tmp/nightly-compatibility/
          if-no-files-found: ignore
