name: Example compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job keeps its name: the repository ruleset requires `published-examples`.
  # It checks that the examples in the checkout use the checkout's package
  # (../package/main.roc), and checks, runs and builds them against it. The
  # release archive, pinned to the bundle URL, is tested by tests and release.
  published-examples:
    name: published-examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}

      - name: Check the examples use the package source
        run: python3 scripts/workflow_helpers.py validate-examples

      - name: Test the examples against the checkout's package
        run: python3 scripts/test_bundle_examples.py --checkout
