name: Benchmarks

# The full comparison with Go, Rust and Python, weekly and on demand, through
# Blueprint's bench environment: Go, Rust and Python come from the nixpkgs
# revision Blueprint.lock records, and Roc is the latest nightly. Pull
# requests run a smoke run of the roc-parser drivers in ci.yml. Timings from
# hosted runners are noisy; see docs/benchmarks.adoc.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Benchmark comparison
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@93ca242217b1b7590554b9a12b9ac3bbfbf8bcbe
        with:
          install-nix: 'true'
      - id: nightly
        name: Resolve the latest Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.nightly.outputs.tag }}
      - name: Run the full comparison
        run: blueprint run bench -- --label ci
      - name: Publish the summary
        run: cat .roc-parser-tmp/bench/ci/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.run_id }}
          path: |
            .roc-parser-tmp/bench/ci/results.json
            .roc-parser-tmp/bench/ci/report.md
            .roc-parser-tmp/bench/ci/corpus/manifest.json
            .roc-parser-tmp/bench/ci/logs/
          if-no-files-found: warn
          retention-days: 90
