name: Release

# Every pull request builds and tests the release as a dry run, under the
# version 0.0.1-dryrun, and publishes nothing. A maintainer dispatches the
# workflow from main with a version to publish the same files. The shared
# workflow owns the jobs: the examples against the working tree, the bundle,
# the examples archive, the API reference archive and the rendered notes; the
# archived examples against that exact bundle on a loopback address, in a job
# with no copy of this repository; and the publisher, which checks out nothing.
# `blueprint run check` stays in ci.yml: it takes about half an hour, longer
# than the shared build job allows. See docs/maintaining.adoc.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix, such as 3.1.0 or 3.1.0-rc.1; empty runs the dry run
        type: string
        default: ''
      nightly-tag:
        description: Exact Roc nightly for a diagnostic run; empty resolves the latest
        type: string
        default: ''

permissions: {}

jobs:
  Release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/release-package.yml@93ca242217b1b7590554b9a12b9ac3bbfbf8bcbe
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      check-task: ''
