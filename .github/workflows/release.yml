name: Release

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
      release_version:
        description: "Release version, e.g. 1.0.1"
        required: false
        type: string
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}

jobs:
  build:
    name: Build release bundle
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"
      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && inputs.release_version || '' }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          github_token: ${{ github.token }}
      - name: Validate release branch
        if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/workflow_helpers.py validate-release-ref --ref-type "$RELEASE_REF_TYPE" --ref-name "$RELEASE_REF_NAME" --default-branch "$DEFAULT_BRANCH"
      - name: Test Python automation
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Validate package
        run: python3 scripts/all_tests.py
      # The API audit: every exposed module and entry has a doc comment.
      - name: Check the API reference
        run: python3 scripts/build_docs.py --check
      - name: Resolve previous release
        if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
        id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          github_token: ${{ github.token }}
      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          # Older bundles may not compile with the currently pinned Roc nightly.
          bump_check: warn
          bump_entrypoint: package/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}
      - name: Bundle package
        run: python3 scripts/bundle.py --output-dir dist
      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["ubuntu-latest"]'
      # Dry-run cover for the documentation assets the publish job attaches:
      # the manual (HTML and PDF) and the `roc docs` API reference, built
      # exactly as the publish job builds them, then thrown away.
      - name: Check the documentation assets can be built
        run: python3 scripts/release_helpers.py package-docs --release-version dry-run --output-dir .release/docs-dry-run
      - name: Discard the documentation dry run
        run: rm -rf .release/docs-dry-run
      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test ${{ matrix.bundle_name }} bundle (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"
      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: .release/test-bundles
      - name: Test release bundle
        uses: roc-lang/release-package/actions/test-bundle@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          test_bundle_command: python3 scripts/test_bundle_examples.py --bundle-path
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build.outputs.release_version }}

  release-validation:
    name: release-validation
    if: always()
    needs: [build, test-bundles]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful release validation
        run: python3 scripts/workflow_helpers.py require-success "${{ needs.build.result }}" "${{ needs.test-bundles.result }}"

  publish-release:
    name: Publish GitHub release
    needs: [build, test-bundles, release-validation]
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && needs.release-validation.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: .release/bundles
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: .release
      # Notes come from docs/releases/<version>.md, followed by the package
      # URL, any `roc bump` API changes and links to this release's docs.
      - name: Make release notes
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          DOCS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/release_helpers.py make-release-notes --release-version "$RELEASE_VERSION" --release-bundles .release/release-bundles.json --bump-output .release/bump-output.txt --output-file .release/release-notes.md --docs-url "$DOCS_URL" --notes-dir docs/releases
      - name: Generate release SBOM
        id: security
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/release_security_assets.py sbom --bundle-dir .release/bundles --release-list-file .release/release-bundles.json --release-version "$RELEASE_VERSION" --output-dir .release/security-assets --github-output "$GITHUB_OUTPUT"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.security.outputs.bundle-path }}
      - name: Attest SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.security.outputs.bundle-path }}
          sbom-path: ${{ steps.security.outputs.sbom-path }}
      - name: Prepare offline attestation bundle
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom-attestation.outputs.bundle-path }}
          ATTESTATION_PATH: ${{ steps.security.outputs.attestation-path }}
        run: python3 scripts/release_security_assets.py combine-attestations --provenance-bundle "$PROVENANCE_BUNDLE" --sbom-bundle "$SBOM_BUNDLE" --output "$ATTESTATION_PATH"
      - name: Read Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"
      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
      # Every release carries its own documentation: the manual as a static
      # site and as a PDF, and the `roc docs` API reference. Pages serves the
      # latest; these keep each release's copy with the release.
      - name: Package documentation
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
        run: python3 scripts/release_helpers.py package-docs --release-version "$RELEASE_VERSION" --docs-version "$DOCS_VERSION" --output-dir .release
      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          additional_assets: |
            ${{ steps.security.outputs.sbom-path }}
            ${{ steps.security.outputs.attestation-path }}
            .release/roc-parser-manual-${{ needs.build.outputs.release_version }}.zip
            .release/roc-parser-manual-${{ needs.build.outputs.release_version }}.pdf
            .release/roc-parser-api-docs-${{ needs.build.outputs.release_version }}.zip
          github_token: ${{ github.token }}

  update-examples:
    name: Update example URLs
    needs: [build, publish-release]
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"
      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: .release
      - name: Resolve release bundle URL
        id: bundle-url
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/workflow_helpers.py bundle-url --metadata .release/release-bundles.json --repository "$GITHUB_REPOSITORY" --version "$RELEASE_VERSION" --github-output "$GITHUB_OUTPUT"
      - name: Update example package URLs
        env:
          BUNDLE_URL: ${{ steps.bundle-url.outputs.bundle-url }}
        run: python3 scripts/update_example_urls.py --bundle-url "$BUNDLE_URL"
      - name: Validate updated examples
        run: python3 scripts/workflow_helpers.py validate-examples
      - name: Create signed release follow-up commit
        id: follow-up
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/github_signed_commit.py --repository "$GITHUB_REPOSITORY" --branch "release-followup/$RELEASE_VERSION" --message "Update examples for $RELEASE_VERSION" --path examples --github-output "$GITHUB_OUTPUT"
      - name: Open or update release follow-up PR
        if: steps.follow-up.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/github_pull_request.py --repository "$GITHUB_REPOSITORY" --head "release-followup/$RELEASE_VERSION" --base "$GITHUB_REF_NAME" --title "Update examples for $RELEASE_VERSION" --body "Updates example package URLs for release $RELEASE_VERSION. The commit was automatically signed by GitHub."

  publish-docs:
    name: Publish the docs
    needs: [build, publish-release]
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read Roc version
        id: roc-version
        run: python3 scripts/workflow_helpers.py roc-version --github-output "$GITHUB_OUTPUT"
      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
      # Pages shows the current release only: the manual at the root and the
      # API reference under api/. Each release carries its own copy of both as
      # attached assets (package-docs), so nothing old accumulates here.
      - name: Build the API reference
        env:
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
        run: python3 scripts/build_docs.py --docs-root .docs-api --version "$DOCS_VERSION"
      - name: Build the manual
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: python3 scripts/build_manual.py --pdf --docs-version "$RELEASE_VERSION" --output .docs-out
      - name: Assemble the site
        env:
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
        run: python3 scripts/release_helpers.py assemble-pages --manual .docs-out/site --api ".docs-api/$DOCS_VERSION" --repo "$GITHUB_REPOSITORY" --output .pages
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
