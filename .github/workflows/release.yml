name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix
        type: string
        required: true
      nightly-tag:
        description: Exact Roc nightly; empty resolves the latest
        type: string
        default: ''
  pull_request:

permissions: {}

jobs:
  validate:
    name: Validate
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      nightly-tag: ${{ inputs.nightly-tag || '' }}

  release:
    name: Release
    needs: validate
    if: ${{ always() && !cancelled() && (github.event_name == 'pull_request' || needs.validate.result == 'success') }}
    uses: lukewilliamboswell/roc-automation/.github/workflows/release-package.yml@e6f1c1a5397e2ecaa94faa52eb6acf5f80dd35da
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ needs.validate.outputs.nightly || '' }}
      # CI checks pull requests; dispatched releases require the same validation above.
      check-task: ''
      sbom-author: 'Organization: roc-parser contributors'
      sbom-task: sbom-composition
      manual: true
      build-timeout-minutes: 75

  docs:
    name: Build the documentation site
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@e6f1c1a5397e2ecaa94faa52eb6acf5f80dd35da
      - uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@e6f1c1a5397e2ecaa94faa52eb6acf5f80dd35da
        with:
          nightly-tag: ${{ needs.release.outputs.nightly }}
      - env:
          VERSION: ${{ needs.release.outputs.version }}
        run: blueprint run docs -- --docs-version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: .docs-out/site/
          if-no-files-found: error

  pages:
    name: Prepare the Pages site
    needs: [release, docs]
    if: github.event_name == 'workflow_dispatch' && !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-pages:
    name: Deploy the Pages site
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
