name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.11.0"
        required: true
        type: string
  pull_request:

env:
  ZIG_VERSION: "0.16.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: Build package bundle
    runs-on: ubuntu-24.04
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install Roc
        uses: roc-lang/setup-roc@main
        with:
          version: nightly-new-compiler

      - name: Run full CI checks
        run: ./ci/all_tests.sh

      - name: Bundle package
        id: bundle
        run: |
          BUNDLE_OUTPUT=$(scripts/bundle.sh --output-dir dist 2>&1)
          echo "$BUNDLE_OUTPUT"

          BUNDLE_PATH=$(echo "$BUNDLE_OUTPUT" | grep "^Created:" | awk '{print $2}')
          BUNDLE_FILENAME=$(basename "$BUNDLE_PATH")

          if [ -z "$BUNDLE_FILENAME" ]; then
            echo "Error: could not extract bundle filename from roc bundle output"
            exit 1
          fi

          echo "bundle_filename=$BUNDLE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload package bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-bundle
          path: dist/${{ steps.bundle.outputs.bundle_filename }}
          retention-days: 30

  test-bundle:
    name: Test package bundle (${{ matrix.os }})
    needs: build-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - windows-2025
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install Roc
        uses: roc-lang/setup-roc@main
        with:
          version: nightly-new-compiler

      - name: Download package bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: package-bundle
          path: dist

      - name: Test examples against downloaded bundle
        run: python3 ci/test_bundle_examples.py --bundle-path "dist/${{ needs.build-bundle.outputs.bundle_filename }}"

  create-release:
    name: Create GitHub release
    needs:
      - build-bundle
      - test-bundle
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    outputs:
      release_tag: ${{ steps.release_version.outputs.release_tag }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Download package bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: package-bundle
          path: dist

      - name: Install Roc
        uses: roc-lang/setup-roc@main
        with:
          version: nightly-new-compiler

      - name: Validate release version
        id: release_version
        env:
          RAW_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" != "branch" ]]; then
            echo "Release workflow must be run from a branch so generated docs can be committed."
            exit 1
          fi

          RELEASE_VERSION="${RAW_RELEASE_VERSION#v}"
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use x.y.z format, e.g. 0.11.0"
            exit 1
          fi

          echo "release_tag=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUNDLE_FILE="dist/${{ needs.build-bundle.outputs.bundle_filename }}"
          ROC_VERSION=$(roc version)
          RELEASE_TAG="${{ steps.release_version.outputs.release_tag }}"

          gh release create "$RELEASE_TAG" \
            "$BUNDLE_FILE" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes "Parser package bundle built with Roc $ROC_VERSION."

  publish-docs:
    name: Publish release docs
    needs:
      - create-release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Roc
        uses: roc-lang/setup-roc@main
        with:
          version: nightly-new-compiler

      - name: Generate versioned docs
        run: ./docs.sh "${{ needs.create-release.outputs.release_tag }}"

      - name: Commit generated docs
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
        run: |
          if git diff --quiet -- www; then
            echo "No docs changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www
          git commit -m "Update docs for $RELEASE_TAG"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./www"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
