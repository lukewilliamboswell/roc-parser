name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without a v prefix
        type: string
        required: true
      nightly-tag:
        description: Exact Roc nightly; empty resolves the latest
        type: string
        default: ''
  pull_request:

permissions: {}

jobs:
  release:
    name: Release
    uses: lukewilliamboswell/roc-automation/.github/workflows/release-package.yml@cc6d4081762c6d70bf95bf18c9abf99b5e9ade25
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      # Pull requests run the full suite in CI; a dispatched release runs it here.
      check-task: ${{ github.event_name == 'workflow_dispatch' && 'check' || '' }}
      sbom-author: 'Organization: roc-parser contributors'
      sbom-task: sbom-composition
      manual: true
      build-timeout-minutes: 75

  docs:
    name: Build the documentation site
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@cc6d4081762c6d70bf95bf18c9abf99b5e9ade25
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          download-method: asset-api
          version: nightly
          nightly-tag: ${{ needs.release.outputs.nightly }}
      - env:
          VERSION: ${{ needs.release.outputs.version }}
        run: blueprint run docs -- --docs-version "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site
          path: .docs-out/site/
          if-no-files-found: error

  pages:
    name: Prepare the Pages site
    needs: [release, docs]
    if: github.event_name == 'workflow_dispatch' && !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation-site
          path: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy-pages:
    name: Deploy the Pages site
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
