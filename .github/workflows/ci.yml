name: CI

# The working tree on the latest Roc nightly. `blueprint run check` holds
# everything a pull request must pass (scripts/check_all.roc lists it): the
# package's checks and tests, the examples against tests/examples.json, a
# release dry run against a loopback bundle, the manual's examples, and smoke runs of every fuzz target, conformance review, oracle and
# benchmark. Long campaigns run in fuzz.yml and bench.yml. The `check` job is
# the required status check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      nightly-tag:
        description: Exact Roc nightly; empty resolves the latest
        type: string
        default: ''
    outputs:
      nightly:
        description: Exact Roc nightly that passed validation
        value: ${{ jobs.check.outputs.nightly }}

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      nightly: ${{ steps.nightly.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@cc6d4081762c6d70bf95bf18c9abf99b5e9ade25
        with:
          cache: 'true'
          cache-workload: check
          install-nix: 'true'
      - name: Activate the locked Ruby oracle runtime
        run: blueprint env oracle-ruby --github-path >> "$GITHUB_PATH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: nightly
        name: Resolve the requested or latest Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.nightly-tag || '' }}
        run: gh release view --repo roc-lang/nightlies --json tagName --jq 'if (.tagName | test("^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}$")) then "tag=" + .tagName else error("Expected a Roc nightly tag") end' -- ${REQUESTED_TAG:+"$REQUESTED_TAG"} >> "$GITHUB_OUTPUT"
      - uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
        with:
          download-method: asset-api
          version: nightly
          nightly-tag: ${{ steps.nightly.outputs.tag }}
      - run: blueprint run check
      - name: Upload evidence and reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-evidence
          path: |
            .roc-parser-tmp/fuzz/runs/
            .roc-parser-tmp/asciidoc/review/
            .roc-parser-tmp/asciidoc/performance-smoke/
            .roc-parser-tmp/roc-syntax-validation/*.json
            .roc-parser-tmp/roc-syntax-validation/*.stdout
            .roc-parser-tmp/roc-syntax-validation/*.stderr
            .roc-parser-tmp/bench/quick/
          if-no-files-found: ignore
          retention-days: 14
