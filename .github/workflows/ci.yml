name: CI

# The working tree on the latest Roc nightly. `blueprint run check` holds
# everything a pull request must pass (scripts/check_all.roc lists it): the
# package's checks and tests, the examples against tests/spec.json, a
# release dry run against a loopback bundle, the manual's examples, native Roc
# fuzz smoke campaigns, and Roc benchmark driver smoke runs. Cross-language
# comparisons run locally. The `check` job is the required status check.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      nightly-tag:
        description: Exact Roc nightly; empty resolves the latest
        type: string
        default: ''
    outputs:
      nightly:
        description: Exact Roc nightly that passed validation
        value: ${{ jobs.check.outputs.nightly }}

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      nightly: ${{ steps.nightly.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@e6f1c1a5397e2ecaa94faa52eb6acf5f80dd35da
        with:
          cache: 'true'
          cache-workload: check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: nightly
        name: Resolve the requested or latest Roc nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.nightly-tag || '' }}
        run: gh release view --repo roc-lang/nightlies --json tagName --jq 'if (.tagName | test("^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7,40}$")) then "tag=" + .tagName else error("Expected a Roc nightly tag") end' -- ${REQUESTED_TAG:+"$REQUESTED_TAG"} >> "$GITHUB_OUTPUT"
      - uses: lukewilliamboswell/roc-automation/actions/setup-roc-nightly@e6f1c1a5397e2ecaa94faa52eb6acf5f80dd35da
        with:
          nightly-tag: ${{ steps.nightly.outputs.tag }}
      - run: blueprint run check
      - name: Upload evidence and reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-evidence
          path: |
            .roc-parser-tmp/fuzz/runs/
            .roc-parser-tmp/bench/quick/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
