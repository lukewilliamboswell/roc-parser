[package]
name = "roc-parser-compare"
version = "0.0.0"
edition = "2021"
publish = false

# Exact versions; Cargo.lock pins the full dependency graph.
[dependencies]
csv = "=1.3.1"
yaml-rust2 = "=0.10.3"
serde_yaml = "=0.9.34"
quick-xml = "=0.38.3"
roxmltree = "=0.21.1"
pulldown-cmark = { version = "=0.13.0", default-features = false }
comrak = { version = "=0.43.0", default-features = false }
httparse = "=1.10.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "compare"
path = "src/main.rs"
